[package]
name = "btboy"
version = "0.1.0"
edition = "2021"
description = "自动追番 Telegram 机器人：订阅蜜柑 RSS、智能解析集数/版本/简繁、定时推送磁力链接到频道"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
dotenvy = "0.15"
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
rss = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teloxide = { version = "0.13", default-features = false, features = ["rustls", "macros", "ctrlc_handler"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
